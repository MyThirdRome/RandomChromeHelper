<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Content Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Random Content Generator</h1>
    
    <div class="content-box" id="content-display">
      <p id="random-content">Click a button below to generate random content!</p>
    </div>
    
    <div class="button-container">
      <button id="quote-btn" class="btn">Random Quote</button>
      <button id="fact-btn" class="btn">Random Fact</button>
      <button id="color-btn" class="btn">Random Color</button>
      <button id="joke-btn" class="btn">Random Joke</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
